name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: import signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVID_P12_PASSWORD }}
        run: |
          KC_PASS="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KC_PASS" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KC_PASS" build.keychain
          security import "$RUNNER_TEMP/devid.p12" -k build.keychain \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          # without this codesign blocks on a ui prompt that never comes
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" build.keychain >/dev/null
          security list-keychains -d user -s build.keychain login.keychain
          rm -f "$RUNNER_TEMP/devid.p12"

      - name: version matches tag
        run: |
          declared="$(sed -n 's/.*current = "\(.*\)".*/\1/p' Sources/DefaultAppsCore/Version.swift)"
          if [ "$declared" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::tag is ${GITHUB_REF_NAME} but Version.current is ${declared} — bump Version.swift" >&2
            exit 1
          fi

      - name: package
        env:
          SIGN_IDENTITY: ${{ secrets.DEVID_IDENTITY }}
        run: |
          scripts/package-app.sh "${GITHUB_REF_NAME#v}"
          scripts/package-cli.sh "${GITHUB_REF_NAME#v}"

      - name: notarize
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc.p8"
          scripts/notarize.sh
          scripts/notarize.sh "build/mda-${GITHUB_REF_NAME#v}-universal/mda"
          rm -f "$RUNNER_TEMP/asc.p8"

      - name: zip
        run: |
          ditto -c -k --keepParent build/macOSDefaultApps.app \
            "build/macOSDefaultApps-${GITHUB_REF_NAME#v}.zip"

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            "build/macOSDefaultApps-${GITHUB_REF_NAME#v}.zip" \
            "build/mda-${GITHUB_REF_NAME#v}-universal.tar.gz"

  tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: bump the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          git clone \
            "https://x-access-token:${TAP_TOKEN}@github.com/klabast/homebrew-tap.git" tap
          scripts/bump-tap.sh "$version" tap
          cd tap
          if git diff --quiet; then
            echo "tap already at $version"
            exit 0
          fi
          git config user.name klabast
          git config user.email 74070528+klabast@users.noreply.github.com
          git commit -am "mda + cask $version"
          git push
